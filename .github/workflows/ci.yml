name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Create docker image
        run: docker build -t events-api:latest .
      - name: Start container
        run: docker run -d -p 5000:5000 --name events-api-container events-api:latest
      - name: Health check
        run: |
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:5000/api/health
