name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create docker image
        run: docker build -t events-api:latest .
      - name: Start Container
        run: docker run -d -p 5000:5000 --name events-api-container events-api:latest
      - name: Health Check
        run: |
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:5000/api/health
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v
      - name: Stop and Remove Docker Container
        if: always()
        run: docker rm -f events-api-container
