name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker Image
        run: docker build -t events-api:latest .
      - name: Start Container
        run: docker run -d -p 5000:5000 --name events-api-container events-api:latest
      - name: Health Check
        run: |
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:5000/api/health
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v
      - name: Stop and Remove Docker Container
        if: always()
        run: docker rm -f events-api-container

  deploy:
    needs: test
    # Deploy only on pushes to main, never on pull requests
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
        run: echo "$DOCKERHUB_TOKEN"| docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker Image
        run: docker build --platform linux/amd64 -t "$IMAGE" .

      - name: Push Docker Image
        run: docker push "$IMAGE"

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
